name: Fetch drops

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:  # Allow manual triggering from the Actions tab
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_mattel.py'
      - '.github/workflows/fetch.yml'

# Allow the workflow to commit back to the repo
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetcher
        run: python scripts/fetch_mattel.py

      - name: Commit changes if any
        run: |
          git config user.name  "drop-tracker[bot]"
          git config user.email "drop-tracker@users.noreply.github.com"

          # Only commit if there are actual changes
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "auto: update drops $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Changes committed."
          else
            echo "No changes."
          fi
